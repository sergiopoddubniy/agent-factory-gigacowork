# Правила консолидации группы «Северный порт»
#
# Источник каждого параметра назван явно — правило computational_core.md:
# «числовой параметр методики, полученный от клиента, применяется без
# изменений». Ничего в этом файле не выведено и не подобрано агентом или
# харнесом: каждое число и каждое соответствие переписаны из
# `клиент/01_Методика_консолидации.md` (регламент, редакция 3, утверждён
# 12.01.2026) дословно. Правки регламента — новая редакция этого файла, а
# не правка кода харнеса.

источник_регламента: "01_Методика_консолидации.md, редакция 3, утверждён финансовым директором 12.01.2026"

# --- 1. Периметр консолидации (регламент §1) --------------------------------
периметр:
  - код: SP
    каноническое_имя: "АО «Северный порт»"
    роль: материнская
    доля_группы: 1.0
  - код: PL
    каноническое_имя: "ООО «Порт-Логистика»"
    роль: дочерняя
    доля_группы: 1.0
  - код: PS
    каноническое_имя: "ООО «Порт-Сервис»"
    роль: дочерняя
    доля_группы: 1.0

# Организационно-правовые токены, которые нормализация признаёт формой
# компании (могут стоять и в начале, и в конце названия — реестр 2 квартала
# записал часть компаний с формой после названия).
орг_формы: ["АО", "ООО", "ЗАО", "ПАО", "ОАО", "ИП"]

# --- 2. Порог существенности ВГО (регламент §4.1) ---------------------------
# Порог установлен финансовым директором 12.01.2026 и применяется без
# изменений до следующей редакции регламента. Аудитор в прошлом году
# советовал поднять порог до 100 000 руб.; финансовый директор оставил
# 50 000 «до пересмотра регламента», пересмотр не назначен (интейк,
# 18.09.2026) — своё значение здесь не вводится.
порог_существенности_вго: 50000

# --- 3. Соответствие статей формы кодам счетов ОСВ (регламент §3) -----------
# source: откуда брать значение счёта.
#   "конец_дт" / "конец_кт"   — сальдо на конец периода (для Ф1)
#   "оборот_дт" / "оборот_кт" — оборот за период (для Ф2)
# formula: сумма (с учётом знака) вкладов source по перечисленным счетам.
статьи_ф1:
  - код: "1150"
    статья: "Основные средства"
    слагаемые:
      - {счёт: "01", source: конец_дт, знак: 1}
      - {счёт: "02", source: конец_кт, знак: -1}
  - код: "1170"
    статья: "Финансовые вложения"
    слагаемые:
      - {счёт: "58", source: конец_дт, знак: 1}
  - код: "1190"
    статья: "Прочие внеоборотные активы"
    слагаемые: []           # не заполняется — источника в ОСВ нет (регламент §3)
  - код: "1210"
    статья: "Запасы"
    слагаемые:
      - {счёт: "10", source: конец_дт, знак: 1}
      - {счёт: "41", source: конец_дт, знак: 1}
  - код: "1230"
    статья: "Дебиторская задолженность"
    слагаемые:
      - {счёт: "62", source: конец_дт, знак: 1}
  - код: "1250"
    статья: "Денежные средства и денежные эквиваленты"
    слагаемые:
      - {счёт: "51", source: конец_дт, знак: 1}
  - код: "1260"
    статья: "Прочие оборотные активы"
    слагаемые: []           # не заполняется
  - код: "1310"
    статья: "Уставный капитал"
    слагаемые:
      - {счёт: "80", source: конец_кт, знак: 1}
  - код: "1370"
    статья: "Нераспределенная прибыль (непокрытый убыток)"
    слагаемые:
      - {счёт: "84", source: конец_кт, знак: 1}
      - {счёт: "99", source: конец_кт, знак: 1}
  - код: "1410"
    статья: "Заемные средства (долгосрочные)"
    слагаемые:
      - {счёт: "67", source: конец_кт, знак: 1}
  - код: "1520"
    статья: "Кредиторская задолженность"
    слагаемые:
      - {счёт: "60", source: конец_кт, знак: 1}
      - {счёт: "68.04", source: конец_кт, знак: 1}
  - код: "1540"
    статья: "Оценочные обязательства"
    слагаемые: []           # не заполняется

статьи_ф2:
  - код: "2110"
    статья: "Выручка"
    слагаемые:
      - {счёт: "90.01", source: оборот_кт, знак: 1}
  - код: "2120"
    статья: "Себестоимость продаж"
    слагаемые:
      - {счёт: "90.02", source: оборот_дт, знак: 1}
  - код: "2340"
    статья: "Прочие доходы"
    слагаемые:
      - {счёт: "91.01", source: оборот_кт, знак: 1}
  - код: "2350"
    статья: "Прочие расходы"
    слагаемые:
      - {счёт: "91.02", source: оборот_дт, знак: 1}
  - код: "2410"
    статья: "Налог на прибыль"
    слагаемые:
      - {счёт: "68.04", source: оборот_кт, знак: 1}

# Субсчета 90.09 / 91.09 и остальные обороты 90.xx / 91.xx в статьи не
# попадают — они закрывают счёт внутри года (регламент §3, примечание).
исключённые_счета_из_статей: ["90.09", "91.09"]

# --- 4. Итоговые строки — формулами формы, харнес их не считает -------------
# (регламент §3: 1100,1200,1600,1300,1400,1500,1700,2200,2300,2400 —
# формулы уже стоят в утверждённой форме `02_Формы/Консолидация_форма.xlsx`
# и харнес их не трогает; харнес пишет только строки-статьи и G/H.)
итоговые_строки_формулами: ["1100", "1200", "1600", "1300", "1400", "1500",
                            "1700", "2200", "2300", "2400"]

# --- 5. Внутригрупповые операции (регламент §4) -----------------------------
вго:
  типы: ["Расчёты", "Обороты"]
  расчёты:
    описание: "остаток ДЗ компании А (счёт 62) к Б против остатка КЗ компании Б перед А (счёт 60), на конец квартала"
    элиминируемая_статья_а: "1230"   # ДЗ у А
    элиминируемая_статья_б: "1520"   # КЗ у Б
  обороты:
    описание: "выручка А от Б за квартал (счёт 90.01 у А) против себестоимости Б по А (счёт 90.02 у Б)"
    элиминируемая_статья_а: "2110"   # выручка у А
    элиминируемая_статья_б: "2120"   # себестоимость у Б

  # §4.2 — расхождение в пределах порога считается неотражённым документом у
  # стороны Б и дозаписывается у Б: себестоимость (2120) +δ, кредиторская
  # задолженность (1520) +δ, нераспределённая прибыль (1370) −δ, где δ = А−Б.
  корректировка_в_пределах_порога:
    применяется_к: "Б"
    δ_знак: "А_минус_Б"
    статьи:
      - {статья: "2120", знак: 1}
      - {статья: "1520", знак: 1}
      - {статья: "1370", знак: -1}
    примечание: "налоговый эффект корректировки на уровне консолидации не рассчитывается (регламент §4.2)"

  # §4.3 — для одной пары расхождение по «Расчётам» и по «Оборотам» должно
  # совпадать; иначе причина не установлена — консолидация останавливается.
  проверка_согласованности_4_3: обязательна

  # §4.4 — расхождение больше порога: консолидация останавливается,
  # результат не формируется.
  порог_блокирует: обязательно

  # §4.5 — элиминация по данным стороны А после корректировок: 1230 и 1520
  # уменьшаются на остаток по «Расчётам», 2110 и 2120 — на оборот по
  # «Оборотам». Сумма элиминации — «Сумма по данным А» (столбец E реестра),
  # а не среднее и не сумма по Б.
  элиминация_по_данным: "А"

  # §4.6 — инвестиции: 1170 материнской равно Σ1310 дочерних; при
  # неравенстве — консолидация останавливается. Элиминируются взаимно.
  проверка_инвестиций_4_6: обязательна

  # §4.7 — корректировки прошлых кварталов не переносятся: реестр каждого
  # квартала считается заново, харнес не хранит состояние между кварталами.
  накопление_между_периодами: запрещено

# --- 6. Контроли (регламент §5) — все обязаны сойтись -----------------------
# Харнес считает каждый контроль и возвращает объект: id, severity, message,
# fix_hint, where, expected, actual, delta. Список — источник правды для
# `harness/engine.py::CONTROL_IDS`; править названия здесь, не в коде.
контроли:
  - id: "К1-ОСВ-БАЛАНС"
    текст: "ОСВ каждой компании: сумма сальдо Дт = сумме сальдо Кт на конец периода"
  - id: "К2-Ф1-БАЛАНС-ПО-КОМПАНИИ"
    текст: "Ф1 каждой компании: 1600 = 1700"
  - id: "К3-Ф2-ЧИСТАЯ-ПРИБЫЛЬ"
    текст: "Ф2 каждой компании: 2400 = оборот Кт 99 − оборот Дт 99 за период"
  - id: "К4-КОНС-БАЛАНС"
    текст: "Консолидировано: 1600 = 1700"
  - id: "К5-КОНС-1230-1520"
    текст: "1230 конс. = Σ1230 − Σ«Расчёты» по А; 1520 конс. = Σ1520 + Σδ(в пределах порога) − Σ«Расчёты» по А"
  - id: "К6-КОНС-2110-2120"
    текст: "2110 конс. = Σ2110 − Σ«Обороты» по А; 2120 конс. = Σ2120 + Σδ(в пределах порога) − Σ«Обороты» по А"
  - id: "К7-КОНС-2400-1370"
    текст: "2400 конс. = Σ2400 − Σδ; 1370 конс. = Σ1370 − Σδ"
  - id: "К8-ЭЛИМИНАЦИЯ-НЕ-БОЛЬШЕ-СТАТЬИ"
    текст: "сумма элиминации по ВГО не превышает статьи, из которой вычитается, ни у одной компании"
  - id: "К9-ФОРМА-АКТИВ-ПАССИВ"
    текст: "контроль формы «актив − пассив» = 0 во всех столбцах (компании, группа, консолидировано)"

# --- 7. Формат результата (регламент §6) ------------------------------------
результат:
  суммы: "целые рубли, без округления"
  состав:
    - "заполненная форма консолидации (копия утверждённой формы с сохранёнными формулами)"
    - "журнал корректировок и элиминаций (вид, пара компаний, содержание, сумма)"
    - "протокол контролей (по каждому контролю — ожидание, факт, статус)"
