name: Фабрика агентов GigaCowork
description: Превращает идею агента в рабочего агента с доказательствами — спецификация, ворота готовности, комплект поставки, приёмка, проверка результата. Триггеры — «нужен агент, который…», «собрать ассистента», «проверить спецификацию», «собрать комплект», «подготовить воркшоп», «перевести в пилот», «провести приёмку».
